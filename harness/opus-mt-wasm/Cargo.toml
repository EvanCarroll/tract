[package]
name = "tract-opus-mt"
version = "0.1.0"
license = "MIT OR Apache-2.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
clap = { version = "4", features = ["derive"] }
prost = "0.14"
serde_json = "1"
thiserror = "2"
tokenizers = { version = "0.22", default-features = false, features = ["unstable_wasm"] }
tract-onnx = { path = "../../onnx" }
wasm-bindgen = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
